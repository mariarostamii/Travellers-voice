<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traveller's Voice - Travel Survey</title>
</head>

<body>
  <header>
    <h1>Traveller's Voice</h1>
    <p>Thank you for helping us design better travel experiences</p>
  </header>

  <main>
    <form>
      <!-- Personal Info -->
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>
      
      <br>

      <label for="Email">Email</label>
      <input type="text" id="Email"  placeholder="Enter your Email" required>

      <br>

      <label for="Age">Age(optional)</label>
      <input type="number" id="Age"  placeholder="Age">

      <br><br>

      <!-- Question 1 -->
      <label for="role">Which option best describes your travel style?</label>
      <br><br>
      <select id="role">
        <option disabled selected>Select travel style</option>
        <option>Professional traveller (5+ trips/year)</option>
        <option>Occasional traveller (2-4 trips/year)</option>
        <option>Beginner (less than 2 trips/year)</option>
        <option>Business traveller</option>
      </select>

      <!-- Question 2 -->
      <p>Would you recommend adventure travel to a friend?</p>
      <label>
        <input type="radio" name="recommend">Definitely
      </label>
      <label>
        <input type="radio" name="recommend">Maybe 
      </label>
      <label>
        <input type="radio" name="recommend">Not sure 
      </label>
      
      <br><br>

      <!-- Question 3 -->
      <label for="feature">What is your favorite travel destination type?</label>
      <br><br>
      <select id="feature">
        <option disabled selected>Select an option</option>
        <option>Nature & Mountains</option>
        <option>Beach & Sea</option>
        <option>Historical & Cultural Sites</option>
        <option>Local Food & Cuisine</option>
        <option>Shopping & City Tour</option>
      </select>

      <!-- Question 4 -->
      <p>What would you like to see improved? (Check all that apply)</p>
      <label>
        <input type="checkbox"> Transportation (Flights, Trains, Buses)
      </label>
      <br>
      <label>
        <input type="checkbox"> Accommodation (Hotels, Hostels)
      </label>
      <br>
      <label>
        <input type="checkbox"> Local Food & Restaurants
      </label>
      <br>
      <label>
        <input type="checkbox"> Activities & Tours
      </label>
      <br>
      <label>
        <input type="checkbox"> Cost & Budget Options
      </label>
      <br>
      <label>
        <input type="checkbox"> Safety & Security
      </label>
      <br>
      <label>
        <input type="checkbox"> Visa & Documentation
      </label>
      <br>
      <label>
        <input type="checkbox"> Language Support
      </label>
      <br>
      <label>
        <input type="checkbox"> Local Guides & Community
      </label>
      <br>
      <label>
        <input type="checkbox"> Travel Insurance
      </label>
      <br>
      <label>
        <input type="checkbox"> Eco-friendly & Sustainable Options
      </label>

      <br><br>

      <!-- Question 5 -->
      <label for="comments">Any comments or suggestions?</label>
      <br>
      <textarea id="comments" rows="5" cols="50" placeholder="Enter your comments here..."></textarea>
      
      <br><br>

      <!-- Submit Button -->
       <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Traveller's Voice. All rights reserved.</p>
  </footer>
  
</body>
</html>
